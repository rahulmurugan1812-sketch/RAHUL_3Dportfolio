<svg width='400' height='250' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='bg-building' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:#0a0a0a'/>
      <stop offset='50%' style='stop-color:#111111'/>
      <stop offset='100%' style='stop-color:#0a0a0a'/>
    </linearGradient>
    <linearGradient id='model-building' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' style='stop-color:' stop-opacity='0.15'/>
      <stop offset='50%' style='stop-color:#8B5CF6' stop-opacity='0.08'/>
      <stop offset='100%' style='stop-color:' stop-opacity='0.15'/>
    </linearGradient>
    <radialGradient id='glow-building' cx='50%' cy='40%' r='60%'>
      <stop offset='0%' style='stop-color:#8B5CF6;stop-opacity:0.12'/>
      <stop offset='70%' style='stop-color:#8B5CF6;stop-opacity:0.03'/>
      <stop offset='100%' style='stop-color:transparent'/>
    </radialGradient>
  </defs>
  <!-- Dark background -->
  <rect width='400' height='250' fill='url(#bg-building)'/>
  <!-- Subtle glow -->
  <ellipse cx='200' cy='100' rx='180' ry='100' fill='url(#glow-building)'/>
  <!-- Model representation area -->
  <rect x='50' y='30' width='300' height='160' rx='8' fill='url(#model-building)' stroke='#8B5CF6' stroke-opacity='0.15' stroke-width='1'/>
  <!-- Wireframe-like grid lines -->
  <g stroke='#8B5CF6' stroke-opacity='0.06' stroke-width='0.5'>
    <line x1='60' y1='40' x2='340' y2='40'/>
    <line x1='60' y1='70' x2='340' y2='70'/>
    <line x1='60' y1='100' x2='340' y2='100'/>
    <line x1='60' y1='130' x2='340' y2='130'/>
    <line x1='60' y1='160' x2='340' y2='160'/>
    <line x1='100' y1='40' x2='100' y2='180'/>
    <line x1='140' y1='40' x2='140' y2='180'/>
    <line x1='180' y1='40' x2='180' y2='180'/>
    <line x1='220' y1='40' x2='220' y2='180'/>
    <line x1='260' y1='40' x2='260' y2='180'/>
    <line x1='300' y1='40' x2='300' y2='180'/>
  </g>
  <!-- Center model icon -->
  <g transform='translate(200,110)'>
    <circle r='35' fill='#8B5CF6' fill-opacity='0.12' stroke='#8B5CF6' stroke-opacity='0.3' stroke-width='1.5'/>
    <polygon points='-18,-10 18,0 -18,10' fill='' fill-opacity='0.9'/>
  </g>
  <!-- Project title -->
  <text x='200' y='205' font-family='system-ui, -apple-system, sans-serif' font-size='14' font-weight='600' fill='' text-anchor='middle' dominant-baseline='middle'>Commercial Complex Building</text>
  <!-- Category -->
  <text x='200' y='225' font-family='system-ui, -apple-system, sans-serif' font-size='11' fill='#8B5CF6' text-anchor='middle' dominant-baseline='middle'>Architecture • Autodesk Maya</text>
  <!-- Maya badge -->
  <rect x='320' y='215' width='70' height='22' rx='4' fill='#8B5CF6' fill-opacity='0.15' stroke='#8B5CF6' stroke-opacity='0.3' stroke-width='1'/>
  <text x='355' y='228' font-family='JetBrains Mono, monospace' font-size='9' font-weight='600' fill='' text-anchor='middle' dominant-baseline='middle'>MAYA</text>
</svg>
